{% extends 'base.html' %}
{% block content %}
<div x-data="storeAnalysisApp()" x-init="init()" class="app">

    <!-- ============ HEADER ============ -->
    <header class="header">
        <div class="header-left">
            <h1>آنالیز فروشگاه برتر</h1>
            <span class="count" x-text="total.toLocaleString() + ' رکورد'"></span>
        </div>
        <div class="header-right">
            <div class="search">
                <input
                    style="font-family: 'Yekan';"
                    type="text"
                    placeholder="جستجوی کد محصول..."
                    x-model="productCodeInput"
                    @keydown.enter="applyProductCode()"
                >
                <button class="btn btn-ghost" @click="applyProductCode()" :disabled="loading">جست‌وجو</button>
                <button class="btn btn-ghost" @click="clearProductCode()" x-show="filters.product_code">پاک کردن</button>
            </div>
            <button class="btn btn-primary" @click="exportExcel()" :disabled="loading || total === 0">
                <span x-show="!exporting">خروجی اکسل</span>
                <span x-show="exporting" x-cloak>در حال استخراج...</span>
            </button>
        </div>
    </header>

    <!-- ============ FILTERS ============ -->
    <section class="filters">
        <div class="filter">
            <label>فروشگاه</label>
            <select x-model="filters.sales_office_id" @change="onFilterChange()">
                <option value="">همه</option>
                <template x-for="s in stores" :key="s.id">
                    <option :value="s.id" x-text="s.id + ' ' + s.name"></option>
                </template>
            </select>
        </div>

        <div class="filter">
            <label>دسته‌بندی</label>
            <select x-model="filters.category_code" @change="onFilterChange()">
                <option value="">همه</option>
                <template x-for="c in categories" :key="c.code">
                    <option :value="c.code" x-text="c.name"></option>
                </template>
            </select>
        </div>

        <div class="filter filter-actions">
            <button class="btn btn-ghost" @click="resetFilters()" :disabled="!hasFilters">حذف همه فیلترها</button>
        </div>
    </section>

    <!-- ============ TABLE ============ -->
    <section class="table-wrap">
        <div class="table-scroll">
            <table>
                <thead>
                    <tr>
                        <template x-for="col in columns" :key="col.key">
                            <th
                                @click="sortBy(col.key)"
                                @mouseenter="showTip($event, col.tip)"
                                @mouseleave="hideTip()"
                                :class="{ sorted: sort.key === col.key }"
                            >
                                <span x-text="col.label"></span>
                                <span class="sort-ind"
                                    x-show="sort.key === col.key"
                                    x-text="sort.dir === 'asc' ? '▲' : '▼'"></span>
                            </th>
                        </template>
                    </tr>
                </thead>
                <tbody>
                    <template x-if="loading">
                        <tr><td :colspan="columns.length" class="state">در حال بارگذاری…</td></tr>
                    </template>
                    <template x-if="!loading && rows.length === 0">
                        <tr><td :colspan="columns.length" class="state">هیچ رکوردی پیدا نشد</td></tr>
                    </template>

                    <template x-for="row in sortedRows" :key="row.id">
                        <tr :class="{ 'best-store-row': row.best_store }">
                            <template x-for="col in columns" :key="col.key">
                                <td :class="col.cls || ''" x-text="formatCell(row[col.key], col)"></td>
                            </template>
                        </tr>
                    </template>
                </tbody>
            </table>
        </div>

        <!-- ============ PAGINATION ============ -->
        <div class="pagination" x-show="totalPages > 1">
            <button class="btn btn-ghost" @click="goTo(totalPages)" :disabled="page >= totalPages || loading">آخر »</button>
            <button class="btn btn-ghost" @click="goTo(page + 1)" :disabled="page >= totalPages || loading">بعدی ›</button>
            <span class="page-info">
                صفحه <strong x-text="page"></strong> از <strong x-text="totalPages"></strong>
            </span>
            <button class="btn btn-ghost" @click="goTo(page - 1)" :disabled="page === 1 || loading">‹ قبلی</button>
            <button class="btn btn-ghost" @click="goTo(1)" :disabled="page === 1 || loading">« اول</button>
        </div>
    </section>

    <div
        class="tooltip"
        x-show="tooltip.visible"
        x-transition.opacity.duration.120ms
        :style="`left: ${tooltip.x}px; top: ${tooltip.y}px;`"
        x-cloak
        x-text="tooltip.text"
    ></div>

    <!-- ============ AI FAB ============ -->
    <button
        class="ai-fab"
        @click="aiOpen = !aiOpen"
        :class="{ 'ai-fab-open': aiOpen }"
        :aria-label="aiOpen ? 'بستن دستیار' : 'باز کردن دستیار'"
        type="button"
    >
        <svg x-show="!aiOpen" xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2a5 5 0 0 0-5 5v1H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8a2 2 0 0 0-2-2h-1V7a5 5 0 0 0-5-5z"/>
            <circle cx="9" cy="13" r="1"/><circle cx="15" cy="13" r="1"/>
        </svg>
        <svg x-show="aiOpen" x-cloak xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
    </button>

    <!-- ============ AI DRAWER ============ -->
    <aside
        class="ai-drawer"
        :class="{ 'ai-drawer-open': aiOpen }"
        x-cloak
        dir="rtl"
        @keydown.escape.window="aiOpen = false"
    >
        <header class="ai-drawer-header">
            <div class="ai-drawer-title">
                <span class="ai-dot"></span>
                <h2>دستیار تحلیل</h2>
            </div>
            <button class="ai-drawer-close" @click="aiOpen = false" type="button" aria-label="بستن">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
                </svg>
            </button>
        </header>

        <!-- ---------- Prompt editor ---------- -->
        <section class="ai-prompt">
            <label class="ai-prompt-label">
                پرامپت (قابل ویرایش)
                <span class="ai-prompt-hint" x-text="' ' + rowCountForPrompt + ' ردیف آماده ارسال'"></span>
            </label>
            <textarea
                class="ai-prompt-input"
                x-model="aiPrompt"
                rows="10"
                spellcheck="false"
            ></textarea>
            <div class="ai-prompt-actions">
                <button class="btn btn-ghost" @click="resetAiPrompt()" type="button">بازنشانی</button>
                <button class="btn btn-primary" @click="sendAiPrompt()" :disabled="aiLoading || rowCountForPrompt === 0" type="button">
                    <span x-show="!aiLoading">ارسال</span>
                    <span x-show="aiLoading" x-cloak>در حال دریافت…</span>
                </button>
            </div>
        </section>

        <!-- ---------- Chat ---------- -->
        <section class="ai-chat" x-ref="chatScroll">
            <template x-if="aiMessages.length === 0">
                <div class="ai-chat-empty">
                    برای شروع گفتگو روی 'ارسال' کلیک کنید
                </div>
            </template>

            <template x-for="(m, i) in aiMessages" :key="i">
                <div class="ai-msg" :class="m.role === 'user' ? 'ai-msg-user' : 'ai-msg-assistant'">
                    <div class="ai-msg-bubble">
                        <template x-if="m.role === 'assistant'">
                            <span class="ai-msg-text" x-html="renderAssistant(m)"></span>
                        </template>
                        <template x-if="m.role === 'user'">
                            <span class="ai-msg-text" x-text="m.content"></span>
                        </template>
                        <span
                            x-show="m.role === 'assistant' && m.typing"
                            class="ai-caret"
                            aria-hidden="true"
                        ></span>
                    </div>
                </div>
            </template>
        </section>
    </aside>
</div>

<script>
function storeAnalysisApp() {
    return {
        // ----- state -----
        API_BASE: '/api/twelve-month-analysis-store/',
        PAGE_SIZE: 100,

        rows: [],
        total: 0,
        page: 1,
        totalPages: 1,
        loading: false,
        exporting: false,

        productCodeInput: '',   // search box value (applied as filter on Enter)

        stores: [],             // list of {id, name} for the dropdown

        filters: {
            product_code: '',
            sales_office_id: '',
            name: '',
            age_in_months: '',
            category_code: '',
        },

        sort: { key: 'product_code', dir: 'asc' },

        tooltip: { visible: false, text: '', x: 0, y: 0 },

        categories: [
            { code: '17', name: 'ادکلن' },

            { code: '41', name: 'پلیور نیم زیپ' },
            { code: '79', name: 'پلیور یقه اسکی' },
            { code: '88', name: 'پلیور یقه پیراهنی' },
            { code: '86', name: 'پولوشرت آستین بلند' },
            { code: '93', name: 'پولوشرت ساده' },
            { code: '94', name: 'پولوشرت طرح دار' },
            { code: '21', name: 'پیراهن آستین بلند ساده' },
            { code: '97', name: 'پیراهن آستین بلند چهار خانه' },
            { code: '66', name: 'پیراهن آستین بلند راه راه' },
            { code: '20', name: 'پیراهن آستین بلند طرح دار' },
            { code: '22', name: 'پیراهن آستین کوتاه ساده' },
            { code: '23', name: 'پیراهن آستین کوتاه طرح دار' },
            { code: '75', name: 'پیراهن جین آستین کوتاه' },
            { code: '74', name: 'پیراهن جین آستین بلند' },
            { code: '52', name: 'پیراهن ضخیم' },
            { code: '68', name: 'پیراهن نیمه ضخیم' },
            { code: '95', name: 'تی شرت ساده' },
            { code: '28', name: 'تی شرت آستین بلند' },
            { code: '96', name: 'تی شرت طرح دار' },
            { code: '27', name: 'تی شرت یقه اسکی' },
            { code: '60', name: 'جعبه کفش' },
            { code: '14', name: 'جلیقه' },
            { code: '53', name: 'جلیقه شمعی' },
            { code: '33', name: 'جوراب ساق دار' },
            { code: '36', name: 'جوراب ضخیم' },
            { code: '91', name: 'جوراب مچی' },
            { code: '34', name: 'جوراب نیم ساق' },
            { code: '19', name: 'زیر پوش رکابی' },
            { code: '84', name: 'زیرپوش آستین دار' },
            { code: '92', name: 'ست' },
            { code: '13', name: 'سویشرت' },
            { code: '76', name: 'سویشرت بافت' },
            { code: '49', name: 'سویشرت شمعی' },
            { code: '62', name: 'شلوار پارچه ای رگولار' },
            { code: '26', name: 'شلوار اسلش' },
            { code: '69', name: 'شلوار اسلش کتان' },
            { code: '30', name: 'شلوار اسلش ورزشی' },
            { code: '48', name: 'شلوار پارچه ای' },
            { code: '32', name: 'شلوار پارچه ای اسکینی' },
            { code: '61', name: 'شلوار پارچه ای اسلیم' },
            { code: '24', name: 'شلوار جین' },
            { code: '12', name: 'شلوار جین رگولار' },
            { code: '10', name: 'شلوار جین اسکینی' },
            { code: '63', name: 'شلوار جین اسلش' },
            { code: '11', name: 'شلوار جین اسلیم' },
            { code: '25', name: 'شلوار کتان' },
            { code: '15', name: 'شلوار کتان اسلیم' },
            { code: '31', name: 'شلوارک' },
            { code: '81', name: 'شورت اسلیپ' },
            { code: '83', name: 'شورت پادار' },
            { code: '82', name: 'شورت نیم پا' },
            { code: '16', name: 'کاپشن' },
            { code: '78', name: 'کاپشن جین' },
            { code: '51', name: 'کاپشن ضخیم' },
            { code: '87', name: 'کاپشن کتان' },
            { code: '90', name: 'کارت هدیه' },
            { code: '47', name: 'کت تک رسمی' },
            { code: '46', name: 'کت تک روزمره' },
            { code: '80', name: 'کت جین' },
            { code: '77', name: 'کت کتان' },
            { code: '67', name: 'کراوات' },
            { code: '44', name: 'کفش روزمره' },
            { code: '73', name: 'کفش بوت' },
            { code: '43', name: 'کفش رسمی' },
            { code: '59', name: 'کفش نیم بوت رسمی' },
            { code: '70', name: 'کفش نیم بوت روزمره' },
            { code: '45', name: 'کفش ورزشی' },
            { code: '65', name: 'کفی کفش' },
            { code: '39', name: 'کلاه' },
            { code: '40', name: 'کلاه ضخیم' },
            { code: '38', name: 'کمربند رسمی' },
            { code: '37', name: 'کمربند روزمره' },
            { code: '99', name: 'کیف' },
            { code: '71', name: 'هودی' },
        ],

        // ----- columns -----
        columns: [
            { key: 'id',                        label: 'شناسه' },
            { key: 'product_code',              label: 'کد محصول' },
            { key: 'sales_office_id',           label: 'شناسه فروشگاه' },
            { key: 'name',                      label: 'نام فروشگاه', cls: 'tag' },
            { key: 'category_code',             label: 'کد دسته‌بندی', cls: 'tag' },
            { key: 'total_inventory',           label: 'موجودی کل',         cls: 'num', dec: 2 },
            { key: 'first_show_date',           label: 'تاریخ اولین نمایش' },
            { key: 'age_in_months',             label: 'سن (ماه)' },
            { key: 'age_in_days',               label: 'سن (روز)' },
            { key: 'first_month_qty',           label: 'ماه اول',   cls: 'num', dec: 2 },
            { key: 'second_month_qty',          label: 'ماه دوم',   cls: 'num', dec: 2 },
            { key: 'third_month_qty',           label: 'ماه سوم',   cls: 'num', dec: 2 },
            { key: 'forth_month_qty',           label: 'ماه چهارم', cls: 'num', dec: 2 },
            { key: 'fifth_month_qty',           label: 'ماه پنجم',  cls: 'num', dec: 2 },
            { key: 'sixth_month_qty',           label: 'ماه ششم',   cls: 'num', dec: 2 },
            { key: 'seventh_month_qty',         label: 'ماه هفتم',  cls: 'num', dec: 2 },
            { key: 'eighth_month_qty',          label: 'ماه هشتم',  cls: 'num', dec: 2 },
            { key: 'ninth_month_qty',           label: 'ماه نهم',   cls: 'num', dec: 2 },
            { key: 'tenth_month_qty',           label: 'ماه دهم',   cls: 'num', dec: 2 },
            { key: 'eleventh_month_qty',        label: 'ماه یازدهم', cls: 'num', dec: 2 },
            { key: 'twelveth_month_qty',        label: 'ماه دوازدهم', cls: 'num', dec: 2 },
            { key: 'first_month_per',           label: 'درصد ماه اول',    cls: 'num', dec: 2 },
            { key: 'second_month_per',          label: 'درصد ماه دوم',    cls: 'num', dec: 2 },
            { key: 'third_month_per',           label: 'درصد ماه سوم',    cls: 'num', dec: 2 },
            { key: 'forth_month_per',           label: 'درصد ماه چهارم',  cls: 'num', dec: 2 },
            { key: 'fifth_month_per',           label: 'درصد ماه پنجم',   cls: 'num', dec: 2 },
            { key: 'sixth_month_per',           label: 'درصد ماه ششم',    cls: 'num', dec: 2 },
            { key: 'seventh_month_per',         label: 'درصد ماه هفتم',   cls: 'num', dec: 2 },
            { key: 'eighth_month_per',          label: 'درصد ماه هشتم',   cls: 'num', dec: 2 },
            { key: 'ninth_month_per',           label: 'درصد ماه نهم',    cls: 'num', dec: 2 },
            { key: 'tenth_month_per',           label: 'درصد ماه دهم',    cls: 'num', dec: 2 },
            { key: 'eleventh_month_per',        label: 'درصد ماه یازدهم', cls: 'num', dec: 2 },
            { key: 'twelveth_month_per',        label: 'درصد ماه دوازدهم', cls: 'num', dec: 2 },
            { key: 'total_sold_12_months',      label: 'فروش ۱۲ ماهه', cls: 'num', dec: 2 },
            { key: 'best_store', label: 'بهترین فروشگاه', cls: 'num', dec: 0 }
        ],

        // ----- lifecycle -----
        init() {
            this.initAi();
            this.fetchStores();
            this.fetchPage(1);
        },

        // ----- helpers -----
        get hasFilters() {
            return Object.values(this.filters).some(v => v !== '');
        },

        get sortedRows() {
            const { key, dir } = this.sort;
            const mul = dir === 'asc' ? 1 : -1;
            return [...this.rows].sort((a, b) => {
                const va = a[key], vb = b[key];
                if (va == null && vb == null) return 0;
                if (va == null) return 1;
                if (vb == null) return -1;
                const na = Number(va), nb = Number(vb);
                if (!isNaN(na) && !isNaN(nb)) return (na - nb) * mul;
                return String(va).localeCompare(String(vb)) * mul;
            });
        },

        formatCell(v, col) {
            if (v === null || v === undefined || v === '') return '—';
            if (col.cls && col.cls.includes('num') && col.dec !== undefined) {
                const n = Number(v);
                if (isNaN(n)) return v;
                return n.toLocaleString(undefined, {
                    minimumFractionDigits: col.dec,
                    maximumFractionDigits: col.dec,
                });
            }
            return v;
        },

        // ----- tooltip -----
        showTip(event, text) {
            if (!text) return;
            const rect = event.currentTarget.getBoundingClientRect();
            this.tooltip = {
                visible: true,
                text,
                x: rect.left + rect.width / 2,
                y: rect.bottom + 8,
            };
        },

        hideTip() {
            this.tooltip.visible = false;
        },

        // ----- data -----
        async fetchStores() {
            // Distinct store ids + names from the first page of the store table
            try {
                const res = await fetch(`${this.API_BASE}?page_size=1000`);
                const data = await res.json();
                const map = new Map();
                for (const r of data.results || []) {
                    if (!map.has(r.sales_office_id)) {
                        map.set(r.sales_office_id, r.name);
                    }
                }
                this.stores = [...map.entries()]
                    .map(([id, name]) => ({ id, name }))
                    .sort((a, b) => a.id - b.id);
            } catch (e) {
                console.error(e);
            }
        },

        async fetchPage(page) {
            this.loading = true;
            try {
                const q = new URLSearchParams();
                q.set('page', page);
                q.set('page_size', this.PAGE_SIZE);
                for (const [k, v] of Object.entries(this.filters)) {
                    if (v !== '' && v !== null) q.set(k, v);
                }
                const res = await fetch(`${this.API_BASE}?${q.toString()}`);
                const data = await res.json();
                this.rows = data.results || [];
                this.total = data.count || 0;
                this.page = page;
                this.totalPages = Math.max(1, Math.ceil(this.total / this.PAGE_SIZE));
            } catch (e) {
                console.error(e);
                this.rows = [];
                this.total = 0;
            } finally {
                this.loading = false;
            }
        },

        async fetchAllForExport() {
            const out = [];
            const pageSize = 1000;
            let page = 1;
            while (true) {
                const q = new URLSearchParams();
                q.set('page', page);
                q.set('page_size', pageSize);
                for (const [k, v] of Object.entries(this.filters)) {
                    if (v !== '' && v !== null) q.set(k, v);
                }
                const res = await fetch(`${this.API_BASE}?${q.toString()}`);
                const data = await res.json();
                const batch = data.results || [];
                out.push(...batch);
                if (!data.next || batch.length === 0) break;
                page++;
            }
            return out;
        },

        // ----- actions -----
        goTo(page) {
            if (page < 1 || page > this.totalPages || this.loading) return;
            this.fetchPage(page);
        },

        onFilterChange() {
            this.fetchPage(1);
        },

        onCategoryInput(event) {
            const cleaned = (event.target.value || '').replace(/\D/g, '').slice(0, 2);
            if (cleaned !== event.target.value) event.target.value = cleaned;
            this.filters.category_code = cleaned;
            this.onFilterChange();
        },

        applyProductCode() {
            this.filters.product_code = this.productCodeInput.trim();
            this.onFilterChange();
        },

        clearProductCode() {
            this.productCodeInput = '';
            this.filters.product_code = '';
            this.onFilterChange();
        },

        resetFilters() {
            this.filters = {
                product_code: '',
                sales_office_id: '',
                name: '',
                age_in_months: '',
                category_code: '',
            };
            this.productCodeInput = '';
            this.fetchPage(1);
        },

        sortBy(key) {
            if (this.sort.key === key) {
                this.sort.dir = this.sort.dir === 'asc' ? 'desc' : 'asc';
            } else {
                this.sort.key = key;
                this.sort.dir = 'asc';
            }
        },

        async exportExcel() {
            this.exporting = true;
            try {
                const all = await this.fetchAllForExport();
                const headers = this.columns.map(c => c.label);
                const keys = this.columns.map(c => c.key);
                const aoa = [headers, ...all.map(r => keys.map(k => r[k] ?? ''))];
                const ws = XLSX.utils.aoa_to_sheet(aoa);
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, 'StoreAnalysis');
                const stamp = new Date().toISOString().slice(0, 19).replace(/[:T]/g, '-');
                XLSX.writeFile(wb, `store_analysis_${stamp}.xlsx`);
            } catch (e) {
                console.error(e);
            } finally {
                this.exporting = false;
            }
        },

        // ----- ai state -----
        aiOpen: false,
        aiPrompt: '',
        aiMessages: [],       // { role: 'user'|'assistant', content: string, typing?: bool }
        aiLoading: false,
        _aiAbortController: null,

        // default prompt — set on init
        _defaultAiPrompt() {
            return [
                'تو یک تحلیل‌گر موجودی و فروش فروشگاهی هستی. یک آرایه JSON از ردیف‌های فروشگاه-محصول به تو داده می‌شود.',
                'هر ردیف نشان‌دهنده فروش یک محصول مشخص در یک فروشگاه مشخص است.',
                'ستون total_sold_12_months مجموع فروش ۱۲ ماه گذشته در آن فروشگاه است.',
                'ستون best_store نشان می‌دهد که این فروشگاه بهترین فروشنده آن محصول بوده است یا نه.',
                '',
                'وظیفه تو تحلیل تفاوت‌های فروش بین فروشگاه‌های یک محصول است. مشخصاً:',
                '',
                '۱) برای هر محصول، فروش تمام فروشگاه‌ها را با هم مقایسه کن.',
                '۲) مواردی را که فروش بهترین فروشگاه فقط ۱ یا ۲ عدد بیشتر از فروشگاه دوم است، فهرست کن و بگو انتقال موجودی به بهترین فروشگاه توجیه منطقی ندارد.',
                '۳) مواردی را که total_sold_12_months برابر ۱ یا ۲ است و عملاً تصمیم‌گیری درباره بهترین فروشگاه معنادار نیست، جدا کن.',
                '۴) در پایان، خلاصه‌ای کوتاه از این دسته بده: چند محصول واقعاً فروشگاه برتر مشخص دارند و چند محصول به دلیل اختلاف کم یا فروش ناچیز قابل تصمیم‌گیری نیستند.',
                '',
                'داده‌ها را بازمحاسبه نکن و قانون جدید نساز. پاسخ را کاملاً به زبان فارسی بده.',
            ].join('\n');
        },

        // Called from init()
        initAi() {
            this.aiPrompt = this._defaultAiPrompt();
        },

        resetAiPrompt() {
            this.aiPrompt = this._defaultAiPrompt();
        },

        // Number of rows that would be sent
        get rowCountForPrompt() {
            return this.rows ? this.rows.length : 0;
        },

        // Called whenever the data changes (see watchers below)
        notifyDataChanged() {
            if (this.aiMessages.length > 0 && !this.aiLoading) {
                this.aiMessages = [];
            }
        },

        projectRowsForAi(rows) {
            const FIELDS = [
                'product_code',
                'name',
                'category_code',
                'total_inventory',
                'age_in_months',
                'total_sold_12_months',
                'best_store'
            ];
            return rows.map(row => {
                const out = {};
                for (const k of FIELDS) out[k] = row[k];
                return out;
            });
        },

        // Submit
        async sendAiPrompt() {
            if (this.aiLoading || this.rowCountForPrompt === 0) return;

            // capture the current prompt + current rows as a user message
            const userText = this.aiPrompt;
            this.aiMessages.push({ role: 'user', content: userText });
            this.aiMessages.push({ role: 'assistant', content: '', typing: true });
            this.aiLoading = true;
            this.$nextTick(() => this.scrollChat());

            try {
                // -------- BACKEND WIRING GOES HERE --------
                const projected = this.projectRowsForAi(this.rows);
                const res = await fetch('/api/ai/analyze/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        prompt: userText,
                        rows: projected,          // or a trimmed version
                    }),
                });
                const data = await res.json();
                if (!res.ok) {
                    throw new Error(data.error || `HTTP ${res.status}`);
                }
                await this.typeAssistantReply(data.reply);
            } catch (e) {
                console.error(e);
                this._replaceLastAssistant('خطا در دریافت پاسخ. لطفاً دوباره تلاش کنید.');
            } finally {
                this.aiLoading = false;
            }
        },

        // Typewriter effect
        async typeAssistantReply(text) {
            const msg = this.aiMessages[this.aiMessages.length - 1];
            msg.content = '';
            msg.typing = true;

            const CHUNK = 3;       // chars per tick
            const DELAY = 18;      // ms between ticks
            for (let i = 0; i < text.length; i += CHUNK) {
                msg.content += text.slice(i, i + CHUNK);
                this.$nextTick(() => this.scrollChat());
                await new Promise(r => setTimeout(r, DELAY));
            }
            msg.typing = false;
            this.$nextTick(() => this.scrollChat());
        },

        _replaceLastAssistant(text) {
            const last = this.aiMessages[this.aiMessages.length - 1];
            if (last && last.role === 'assistant') {
                last.content = text;
                last.typing = false;
            }
        },

        // Render assistant content: convert newlines to <br> and bold **text**
        renderAssistant(m) {
            if (!m.content) return '';
            let s = m.content
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;');
            s = s.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
            s = s.replace(/\n/g, '<br>');
            return s;
        },

        // Auto-scroll the chat to the bottom
        // scrollChat() {
        //     const el = this.$refs.chatScroll;
        //     if (el) el.scrollTop = el.scrollHeight;
        // },

    };
}
</script>
